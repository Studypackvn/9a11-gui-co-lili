<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f7"><title>Dưới tán thông · Gửi cô Lili</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Quà nhỏ <i>gửi cô Lili.</i></h1><nav><button id="prepare">Soạn quà</button><button id="replay" hidden>Chiếu phim</button><button id="archive">✉ &nbsp; Thư đã mở (<span id="total">0</span>)</button><button id="resetGifts" title="Đưa tất cả hộp quà về dưới cây">Đặt lại quà</button><button id="expand" hidden aria-label="Bật toàn màn hình" title="Bật toàn màn hình"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 8V2h6m4 0h6v6m0 4v6h-6m-4 0H2v-6"/></svg></button></nav></header>
<main><section class="scene" aria-label="Căn nhà Giáng sinh"><div class="stage"><img class="room" src="room.svg" alt="Cây thông giữa căn phòng hoạt hình, cạnh cửa sổ tuyết và lò sưởi"><button id="mantelFrame" aria-label="Phát video của lớp" title="Phát video của lớp"><svg aria-hidden="true" viewBox="0 0 72 41"><path d="M2 2h68v37H2z" fill="#98613d" stroke="#64412f" stroke-width="2"/><path d="M6 6h60v29H6z" fill="#ffe2ab"/><path d="M9 9h54v23H9z" fill="#89bcca"/><circle cx="53" cy="14" r="3" fill="#ffdf8a"/><path d="m9 28 16-15 15 15 13-10 10 10v4H9z" fill="#448572"/><circle cx="36" cy="20" r="9" fill="#205146"/><path d="m34 15 7 5-7 5z" fill="#fff4d6"/></svg></button><div id="pile"></div></div><div id="indoorSnow" aria-hidden="true"></div></section></main>
<footer><span>Chạm vào quà để mở thư</span><b id="remaining" aria-live="polite"></b></footer>
<dialog id="startScreen" aria-label="Bắt đầu"><button type="button" id="enterRoom" autofocus>Start</button></dialog>
<dialog id="card" aria-labelledby="title"><form method="dialog"><button aria-label="Đóng">×</button></form><div class="envelope" aria-hidden="true"><svg viewBox="0 0 66 48" width="66" height="48"><path d="M6 22 32 4l28 18v23H6z" fill="#d7a269"/><g class="noteRise"><rect x="14" y="13" width="38" height="27" rx="2" fill="#fff8e6" stroke="#d8bfa0"/><path d="M21 20h23m-23 5h16" stroke="#bd9b7e"/></g><path d="M6 22 32 36l28-14v23H6z" fill="#dcaa70"/><path d="m6 45 22-15m32 15L38 30" stroke="#ba865b" fill="none"/><circle cx="33" cy="34" r="5" fill="#a7374a"/></svg></div><small id="stamp"></small><h2 id="title"></h2><img id="photo" alt="Ảnh kỷ niệm của lớp" hidden><p id="body"></p><section id="collection"></section><button id="editGift" hidden>Sửa ảnh và lời nhắn</button><button id="fold">Gấp thư lại ♡</button></dialog><dialog id="editor" aria-labelledby="editorTitle"><form method="dialog"><button aria-label="Đóng phần soạn">×</button></form><small>PHẦN 1 · 36 MÓN QUÀ</small><h2 id="editorTitle">Soạn quà</h2><label>Hộp quà <select id="pickGift"></select></label><label>Ảnh trong hộp<input id="choosePhoto" type="file" accept="image/*"></label><img id="thumb" alt="Ảnh đã chọn" hidden><label>Lời nhắn<textarea rows="5" id="draft" placeholder="Dán lời nhắn của bạn vào đây…"></textarea></label><button id="saveGift">Lưu hộp quà</button><hr><label>Video sau hộp cuối<input id="chooseVideo" type="file" accept="video/*"></label><span id="videoName"></span><button id="previewMovie">Thử màn chiếu</button> <button id="downloadShow">Tải bản tặng cô</button><p role="status" id="saved"></p></dialog>
<dialog id="cinema" aria-label="Màn chiếu của lớp"><div class="projector"><div class="roller"></div><section class="canvas"><video id="film" controls playsinline preload="metadata"></video><p id="movieNote"></p><button hidden id="playFilm">▶ Phát video</button></section></div><button id="leaveFilm">Trở về căn phòng</button></dialog>
<script src="letters.js"></script><script src="gifts.js"></script><script src="studio.js"></script></body></html>
